<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecture Hall Manager</title>
    <link rel="stylesheet" href="static/styles.css">
</head>
<body>
    <main class="page">
        <header class="topbar">
            <div class="identity">
                <img class="avatar" src="static/images/Mic.jpg" alt="Microphone">
                <div>
                    <p class="eyebrow">Student</p>
                    <h1>{{ student_name }}</h1>
                    <p class="muted">Table <span id="table-number">{{ table }}</span></p>
                </div>
            </div>

            <form action="logout" method="POST">
                <button class="logout-button" type="submit">Log Out</button>
            </form>
        </header>

        <section class="dashboard">
            <div class="hero-action">
                <div class="status-strip">
                    <div class="status-cell">
                        <span class="stat" id="queue-count">{{ initial_state.queue_count }}</span>
                        <span class="muted">Waiting</span>
                    </div>
                    <div class="status-cell">
                        <span class="status-pill" id="hand-status">Ready</span>
                        <span class="muted">Hand</span>
                    </div>
                    <div class="status-cell">
                        <span class="status-pill" id="mic-status">Inactive</span>
                        <span class="muted">Mic</span>
                    </div>
                </div>

                <section class="panel">
                    <h2>Ask for the mic</h2>
                    <p class="muted">Raise your hand when your table is ready to speak.</p>
                    <button id="hand-button" class="button" type="button"></button>
                    <p id="student-message" class="message"></p>
                </section>
            </div>

            <aside class="panel">
                <h2>Queue</h2>
                <div id="queue-list" class="queue-list"></div>

                <h2 style="margin-top: 24px;">Recently Spoken</h2>
                <div id="recent-list" class="recent-list"></div>
            </aside>
        </section>
    </main>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script>
        const table = {{ table|tojson }};
        const initialState = {{ initial_state|tojson }};
        function buildAppPath(path) {
            const currentPath = window.location.pathname;
            const basePath = currentPath === "/" ? "" : currentPath.replace(/\/$/, "");

            return basePath + "/" + path.replace(/^\//, "");
        }

        const socket = io({
            path: buildAppPath("socket.io"),
            transports: ["websocket"],
            upgrade: false
        });

        const LOW_LATENCY_AUDIO_CONSTRAINTS = {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false,
            latency: { ideal: 0 },
            channelCount: { ideal: 1 },
            sampleRate: { ideal: 48000 },
            sampleSize: { ideal: 16 },
            googEchoCancellation: false,
            googAutoGainControl: false,
            googNoiseSuppression: false,
            googHighpassFilter: false,
            mozNoiseSuppression: false,
            mozAutoGainControl: false
        };

        const LOW_LATENCY_RTC_CONFIG = {
            iceServers: [],
            iceTransportPolicy: "all",
            bundlePolicy: "max-bundle",
            rtcpMuxPolicy: "require",
            iceCandidatePoolSize: 0
        };

        const handButton = document.getElementById("hand-button");
        const handStatus = document.getElementById("hand-status");
        const queueCount = document.getElementById("queue-count");
        const queueList = document.getElementById("queue-list");
        const micStatus = document.getElementById("mic-status");
        const recentList = document.getElementById("recent-list");
        const studentMessage = document.getElementById("student-message");

        let currentState = initialState;
        let handRaised = initialState.q_list.includes(table);
        let peerConnection = null;
        let localStream = null;
        let startingAudio = false;

        function shouldUseIceCandidate(candidate) {
            if (!candidate) {
                return false;
            }

            if (candidate.protocol) {
                return candidate.protocol.toLowerCase() === "udp";
            }

            return /\sudp\s/i.test(candidate.candidate || "");
        }

        function setFmtpValue(parameters, key, value) {
            const parts = parameters
                .split(";")
                .map((part) => part.trim())
                .filter(Boolean);
            const prefix = key + "=";
            const nextValue = prefix + value;
            const existingIndex = parts.findIndex((part) => part.toLowerCase().startsWith(prefix));

            if (existingIndex === -1) {
                parts.push(nextValue);
            } else {
                parts[existingIndex] = nextValue;
            }

            return parts.join(";");
        }

        function tuneOpusForLowLatency(description) {
            if (!description || !description.sdp) {
                return description;
            }

            const sections = description.sdp.split(/(?=m=)/);
            const sdp = sections.map((section) => {
                if (!section.startsWith("m=audio")) {
                    return section;
                }

                const lines = section.split(/\r\n/).filter(Boolean);
                const opusLineIndex = lines.findIndex((line) => /^a=rtpmap:\d+ opus\/48000/i.test(line));

                if (opusLineIndex === -1) {
                    return section;
                }

                const opusPayload = lines[opusLineIndex].match(/^a=rtpmap:(\d+)/)[1];
                const withoutPacketTiming = lines.filter((line) => !/^a=(max)?ptime:/i.test(line));
                const opusInsertIndex = withoutPacketTiming.findIndex((line) => /^a=rtpmap:\d+ opus\/48000/i.test(line));
                const fmtpIndex = withoutPacketTiming.findIndex((line) => line.startsWith("a=fmtp:" + opusPayload));
                const lowLatencyValues = {
                    minptime: "10",
                    useinbandfec: "0",
                    usedtx: "0",
                    stereo: "0",
                    "sprop-stereo": "0"
                };

                if (fmtpIndex === -1) {
                    withoutPacketTiming.splice(opusInsertIndex + 1, 0, "a=fmtp:" + opusPayload + " minptime=10;useinbandfec=0;usedtx=0;stereo=0;sprop-stereo=0");
                } else {
                    const line = withoutPacketTiming[fmtpIndex];
                    const separatorIndex = line.indexOf(" ");
                    const prefix = separatorIndex === -1 ? line : line.slice(0, separatorIndex);
                    let parameters = separatorIndex === -1 ? "" : line.slice(separatorIndex + 1);

                    Object.entries(lowLatencyValues).forEach(([key, value]) => {
                        parameters = setFmtpValue(parameters, key, value);
                    });

                    withoutPacketTiming[fmtpIndex] = prefix + " " + parameters;
                }

                const timingInsertIndex = withoutPacketTiming.findIndex((line) => line.startsWith("a=fmtp:" + opusPayload));
                withoutPacketTiming.splice(timingInsertIndex + 1, 0, "a=ptime:10", "a=maxptime:10");

                return withoutPacketTiming.join("\r\n") + "\r\n";
            }).join("");

            return {
                type: description.type,
                sdp
            };
        }

        async function prioritizeAudioSender(sender) {
            if (!sender || !sender.getParameters || !sender.setParameters) {
                return;
            }

            const parameters = sender.getParameters();

            if (parameters.encodings && parameters.encodings.length) {
                parameters.encodings[0].priority = "high";
                parameters.encodings[0].networkPriority = "high";
            }

            try {
                await sender.setParameters(parameters);
            } catch (error) {
                // Some browsers expose priority fields but reject changing them.
            }
        }

        function getAudioErrorMessage(error) {
            if (!navigator.mediaDevices && !navigator.getUserMedia && !navigator.webkitGetUserMedia && !navigator.mozGetUserMedia) {
                return "Microphone access requires HTTPS on student devices. Use the secure class link.";
            }

            if (!window.isSecureContext) {
                return "Microphone access is blocked on this insecure page. Use the secure class link.";
            }

            return error && error.message ? error.message : "Unable to access microphone.";
        }

        function getMicrophoneStream() {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                return navigator.mediaDevices.getUserMedia({
                    audio: LOW_LATENCY_AUDIO_CONSTRAINTS,
                    video: false
                });
            }

            const legacyGetUserMedia = navigator.getUserMedia || navigator.webkitGetUserMedia || navigator.mozGetUserMedia;

            if (!legacyGetUserMedia) {
                return Promise.reject(new Error(getAudioErrorMessage()));
            }

            return new Promise((resolve, reject) => {
                legacyGetUserMedia.call(
                    navigator,
                    {
                        audio: LOW_LATENCY_AUDIO_CONSTRAINTS,
                        video: false
                    },
                    resolve,
                    reject
                );
            });
        }

        function renderQueue(entries) {
            queueList.innerHTML = "";

            if (!entries.length) {
                const empty = document.createElement("p");
                empty.className = "empty";
                empty.textContent = "No tables waiting.";
                queueList.appendChild(empty);
                return;
            }

            entries.forEach((entry) => {
                const row = document.createElement("div");
                row.className = "queue-item";

                const text = document.createElement("div");
                const name = document.createElement("div");
                name.className = "queue-name";
                name.textContent = entry.name;

                const meta = document.createElement("div");
                meta.className = "queue-meta";
                meta.textContent = "Table " + entry.table;

                text.appendChild(name);
                text.appendChild(meta);
                row.appendChild(text);
                queueList.appendChild(row);
            });
        }

        function renderRecent(entries) {
            recentList.innerHTML = "";

            if (!entries.length) {
                const empty = document.createElement("p");
                empty.className = "empty";
                empty.textContent = "No recent speakers yet.";
                recentList.appendChild(empty);
                return;
            }

            entries.forEach((entry) => {
                const row = document.createElement("div");
                row.className = "recent-item";

                const name = document.createElement("strong");
                name.textContent = entry.name;

                const tableLabel = document.createElement("span");
                tableLabel.textContent = "Table " + entry.table;

                row.appendChild(name);
                row.appendChild(tableLabel);
                recentList.appendChild(row);
            });
        }

        function renderState(state) {
            currentState = state;
            handRaised = state.q_list.includes(table);
            const isActive = state.active_table === table;

            queueCount.textContent = state.queue_count;
            micStatus.textContent = isActive ? "Live" : "Inactive";
            micStatus.className = isActive ? "status-pill active" : "status-pill";
            handStatus.textContent = isActive ? "Speaking" : handRaised ? "Raised" : "Ready";
            handStatus.className = isActive ? "status-pill active" : handRaised ? "status-pill waiting" : "status-pill";
            handButton.textContent = isActive ? "Turn Off Microphone" : handRaised ? "Lower Hand" : "Raise Hand";
            handButton.className = isActive ? "button danger" : "button";

            renderQueue(state.queue || []);
            renderRecent(state.recent_speakers || []);

            if (!isActive) {
                studentMessage.textContent = "";
                closeAudio();
            }
        }

        function closeAudio() {
            if (peerConnection) {
                peerConnection.onicecandidate = null;
                peerConnection.onconnectionstatechange = null;
                peerConnection.close();
                peerConnection = null;
            }

            if (localStream) {
                localStream.getTracks().forEach((track) => track.stop());
                localStream = null;
            }
        }

        async function startAudio() {
            if (peerConnection || startingAudio) {
                return;
            }

            startingAudio = true;
            studentMessage.textContent = "Connecting microphone...";

            try {
                localStream = await getMicrophoneStream();

                peerConnection = new RTCPeerConnection(LOW_LATENCY_RTC_CONFIG);
                const connection = peerConnection;
                const senderPriorities = [];

                localStream.getTracks().forEach((track) => {
                    if (connection.addTransceiver) {
                        const transceiver = connection.addTransceiver(track, {
                            direction: "sendonly",
                            streams: [localStream]
                        });
                        senderPriorities.push(prioritizeAudioSender(transceiver.sender));
                    } else {
                        senderPriorities.push(prioritizeAudioSender(connection.addTrack(track, localStream)));
                    }
                });

                connection.onicecandidate = (event) => {
                    if (shouldUseIceCandidate(event.candidate)) {
                        socket.emit("student_ice_candidate", { candidate: event.candidate });
                    }
                };

                connection.onconnectionstatechange = () => {
                    if (["failed", "disconnected", "closed"].includes(connection.connectionState) && peerConnection === connection) {
                        closeAudio();
                    }
                };

                await Promise.all(senderPriorities);
                const offer = tuneOpusForLowLatency(await connection.createOffer({
                    offerToReceiveAudio: false,
                    offerToReceiveVideo: false
                }));
                await connection.setLocalDescription(offer);
                socket.emit("webrtc_offer", { sdp: connection.localDescription });
                studentMessage.textContent = "Microphone live.";
            } catch (error) {
                const message = getAudioErrorMessage(error);
                closeAudio();
                studentMessage.textContent = message;
                socket.emit("student_audio_error", { message });
            } finally {
                startingAudio = false;
            }
        }

        handButton.addEventListener("click", async () => {
            const isActive = currentState.active_table === table;
            const action = handRaised || isActive ? "lower" : "raise";
            const response = await fetch(buildAppPath("student/hand"), {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ action })
            });

            if (!response.ok) {
                studentMessage.textContent = "Unable to update queue.";
                return;
            }

            renderState(await response.json());
        });

        socket.on("state_update", renderState);

        socket.on("start_audio", async (data) => {
            if (data.table === table) {
                await startAudio();
            }
        });

        socket.on("stop_audio", () => {
            studentMessage.textContent = "";
            closeAudio();
        });

        socket.on("webrtc_answer", async (data) => {
            if (!peerConnection || data.table !== table) {
                return;
            }

            await peerConnection.setRemoteDescription(data.sdp);
        });

        socket.on("instructor_ice_candidate", async (data) => {
            if (!peerConnection || data.table !== table || !data.candidate) {
                return;
            }

            if (shouldUseIceCandidate(data.candidate)) {
                try {
                    await peerConnection.addIceCandidate(data.candidate);
                } catch (error) {
                    studentMessage.textContent = "Network setup failed.";
                }
            }
        });

        window.addEventListener("beforeunload", closeAudio);
        renderState(initialState);
    </script>
</body>
</html>
