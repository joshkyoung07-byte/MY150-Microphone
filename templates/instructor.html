<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecture Hall Manager</title>
    <link rel="stylesheet" href="static/styles.css">
</head>
<body>
    <main class="page">
        <header class="topbar">
            <div class="identity">
                <img class="avatar" src="static/images/Josh.jpeg" alt="Teacher">
                <div>
                    <p class="eyebrow">Teacher</p>
                    <h1>Question Queue</h1>
                    <p class="muted" id="audio-status">No microphone selected.</p>
                </div>
            </div>

            <form action="logout" method="POST">
                <button class="logout-button" type="submit">Log Out</button>
            </form>
        </header>

        <section class="dashboard">
            <div class="hero-action">
                <section id="active-panel" class="panel active-speaker">
                    <h2>Active Mic</h2>
                    <div id="active-speaker"></div>
                    <audio id="remote-audio" autoplay playsinline preload="none"></audio>
                </section>

                <section class="panel">
                    <h2>Waiting</h2>
                    <div id="queue-container" class="queue-list"></div>
                </section>
            </div>

            <aside class="panel">
                <h2>Recently Spoken</h2>
                <div id="recent-list" class="recent-list"></div>
            </aside>
        </section>
    </main>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script>
        const initialState = {{ initial_state|tojson }};
        function buildAppPath(path) {
            const currentPath = window.location.pathname;
            const basePath = currentPath === "/" ? "" : currentPath.replace(/\/$/, "");

            return basePath + "/" + path.replace(/^\//, "");
        }

        const socket = io({
            path: buildAppPath("socket.io"),
            transports: ["websocket"],
            upgrade: false
        });

        const LOW_LATENCY_RTC_CONFIG = {
            iceServers: [],
            iceTransportPolicy: "all",
            bundlePolicy: "max-bundle",
            rtcpMuxPolicy: "require",
            iceCandidatePoolSize: 0
        };

        const queueContainer = document.getElementById("queue-container");
        const audioStatus = document.getElementById("audio-status");
        const remoteAudio = document.getElementById("remote-audio");
        const activeSpeaker = document.getElementById("active-speaker");
        const recentList = document.getElementById("recent-list");

        let currentState = initialState;
        let peerConnection = null;
        let connectedTable = null;

        remoteAudio.preload = "none";

        function shouldUseIceCandidate(candidate) {
            if (!candidate) {
                return false;
            }

            if (candidate.protocol) {
                return candidate.protocol.toLowerCase() === "udp";
            }

            return /\sudp\s/i.test(candidate.candidate || "");
        }

        function setFmtpValue(parameters, key, value) {
            const parts = parameters
                .split(";")
                .map((part) => part.trim())
                .filter(Boolean);
            const prefix = key + "=";
            const nextValue = prefix + value;
            const existingIndex = parts.findIndex((part) => part.toLowerCase().startsWith(prefix));

            if (existingIndex === -1) {
                parts.push(nextValue);
            } else {
                parts[existingIndex] = nextValue;
            }

            return parts.join(";");
        }

        function tuneOpusForLowLatency(description) {
            if (!description || !description.sdp) {
                return description;
            }

            const sections = description.sdp.split(/(?=m=)/);
            const sdp = sections.map((section) => {
                if (!section.startsWith("m=audio")) {
                    return section;
                }

                const lines = section.split(/\r\n/).filter(Boolean);
                const opusLineIndex = lines.findIndex((line) => /^a=rtpmap:\d+ opus\/48000/i.test(line));

                if (opusLineIndex === -1) {
                    return section;
                }

                const opusPayload = lines[opusLineIndex].match(/^a=rtpmap:(\d+)/)[1];
                const withoutPacketTiming = lines.filter((line) => !/^a=(max)?ptime:/i.test(line));
                const opusInsertIndex = withoutPacketTiming.findIndex((line) => /^a=rtpmap:\d+ opus\/48000/i.test(line));
                const fmtpIndex = withoutPacketTiming.findIndex((line) => line.startsWith("a=fmtp:" + opusPayload));
                const lowLatencyValues = {
                    minptime: "10",
                    useinbandfec: "0",
                    usedtx: "0",
                    stereo: "0",
                    "sprop-stereo": "0"
                };

                if (fmtpIndex === -1) {
                    withoutPacketTiming.splice(opusInsertIndex + 1, 0, "a=fmtp:" + opusPayload + " minptime=10;useinbandfec=0;usedtx=0;stereo=0;sprop-stereo=0");
                } else {
                    const line = withoutPacketTiming[fmtpIndex];
                    const separatorIndex = line.indexOf(" ");
                    const prefix = separatorIndex === -1 ? line : line.slice(0, separatorIndex);
                    let parameters = separatorIndex === -1 ? "" : line.slice(separatorIndex + 1);

                    Object.entries(lowLatencyValues).forEach(([key, value]) => {
                        parameters = setFmtpValue(parameters, key, value);
                    });

                    withoutPacketTiming[fmtpIndex] = prefix + " " + parameters;
                }

                const timingInsertIndex = withoutPacketTiming.findIndex((line) => line.startsWith("a=fmtp:" + opusPayload));
                withoutPacketTiming.splice(timingInsertIndex + 1, 0, "a=ptime:10", "a=maxptime:10");

                return withoutPacketTiming.join("\r\n") + "\r\n";
            }).join("");

            return {
                type: description.type,
                sdp
            };
        }

        function minimizeReceiverDelay(connection) {
            if (!connection || !connection.getReceivers) {
                return;
            }

            connection.getReceivers().forEach((receiver) => {
                if ("playoutDelayHint" in receiver) {
                    try {
                        receiver.playoutDelayHint = 0;
                    } catch (error) {
                        // Browser does not allow overriding the jitter buffer target.
                    }
                }
            });
        }

        function createStudentText(entry) {
            const text = document.createElement("div");
            const name = document.createElement("div");
            name.className = "queue-name";
            name.textContent = entry.name;

            const meta = document.createElement("div");
            meta.className = "queue-meta";
            meta.textContent = "Table " + entry.table;

            text.appendChild(name);
            text.appendChild(meta);
            return text;
        }

        function renderActiveSpeaker(activeStudent) {
            activeSpeaker.innerHTML = "";

            if (!activeStudent) {
                const empty = document.createElement("p");
                empty.className = "empty";
                empty.textContent = "No mic is live.";
                activeSpeaker.appendChild(empty);
                return;
            }

            const row = document.createElement("div");
            row.className = "queue-item";
            row.appendChild(createStudentText(activeStudent));

            const button = document.createElement("button");
            button.type = "button";
            button.className = "button danger";
            button.textContent = "Turn Off Mic";
            button.addEventListener("click", () => {
                socket.emit("select_student", { table: activeStudent.table });
            });

            row.appendChild(button);
            activeSpeaker.appendChild(row);
        }

        function renderQueue(entries) {
            queueContainer.innerHTML = "";

            if (!entries.length) {
                const empty = document.createElement("p");
                empty.className = "empty";
                empty.textContent = "No tables waiting.";
                queueContainer.appendChild(empty);
                return;
            }

            entries.forEach((entry) => {
                const row = document.createElement("div");
                row.className = "queue-item";
                row.appendChild(createStudentText(entry));

                const button = document.createElement("button");
                button.type = "button";
                button.className = "button secondary";
                button.textContent = "Activate Mic";
                button.addEventListener("click", () => {
                    remoteAudio.play().catch(() => {});
                    socket.emit("select_student", { table: entry.table });
                });

                row.appendChild(button);
                queueContainer.appendChild(row);
            });
        }

        function renderRecent(entries) {
            recentList.innerHTML = "";

            if (!entries.length) {
                const empty = document.createElement("p");
                empty.className = "empty";
                empty.textContent = "No recent speakers yet.";
                recentList.appendChild(empty);
                return;
            }

            entries.forEach((entry) => {
                const row = document.createElement("div");
                row.className = "recent-item";

                const text = document.createElement("div");
                const name = document.createElement("strong");
                name.textContent = entry.name;

                const tableLabel = document.createElement("span");
                tableLabel.className = "queue-meta";
                tableLabel.textContent = "Table " + entry.table;

                text.appendChild(name);
                text.appendChild(tableLabel);

                const button = document.createElement("button");
                button.type = "button";
                button.className = "button secondary";
                button.textContent = "Activate Again";
                button.addEventListener("click", () => {
                    remoteAudio.play().catch(() => {});
                    socket.emit("select_student", { table: entry.table });
                });

                row.appendChild(text);
                row.appendChild(button);
                recentList.appendChild(row);
            });
        }

        function renderState(state) {
            currentState = state;
            renderActiveSpeaker(state.active_student);
            renderQueue(state.queue || []);
            renderRecent(state.recent_speakers || []);

            if (!state.active_student) {
                audioStatus.textContent = "No microphone selected.";
            } else if (connectedTable === state.active_student.table && peerConnection) {
                audioStatus.textContent = "Listening to " + state.active_student.name + ".";
            } else {
                audioStatus.textContent = "Waiting for " + state.active_student.name + " microphone...";
            }

            if (peerConnection && (!state.active_student || state.active_student.table !== connectedTable)) {
                closeInstructorAudio();
            }
        }

        function closeInstructorAudio() {
            if (peerConnection) {
                peerConnection.ontrack = null;
                peerConnection.onicecandidate = null;
                peerConnection.onconnectionstatechange = null;
                peerConnection.close();
                peerConnection = null;
            }

            connectedTable = null;
            remoteAudio.srcObject = null;
        }

        async function handleOffer(table, sdp) {
            closeInstructorAudio();
            connectedTable = table;

            peerConnection = new RTCPeerConnection(LOW_LATENCY_RTC_CONFIG);
            const connection = peerConnection;

            connection.ontrack = (event) => {
                if (event.receiver && "playoutDelayHint" in event.receiver) {
                    try {
                        event.receiver.playoutDelayHint = 0;
                    } catch (error) {
                        // Browser does not allow overriding the jitter buffer target.
                    }
                }

                remoteAudio.srcObject = event.streams[0];
                remoteAudio.play().catch(() => {});
                const activeStudent = currentState.active_student;
                audioStatus.textContent = activeStudent ? "Listening to " + activeStudent.name + "." : "Listening.";
            };

            connection.onicecandidate = (event) => {
                if (shouldUseIceCandidate(event.candidate)) {
                    socket.emit("instructor_ice_candidate", {
                        table,
                        candidate: event.candidate
                    });
                }
            };

            connection.onconnectionstatechange = () => {
                if (["failed", "disconnected", "closed"].includes(connection.connectionState) && peerConnection === connection) {
                    closeInstructorAudio();
                    if (currentState.active_table === table) {
                        audioStatus.textContent = "Audio connection lost.";
                    }
                }
            };

            await connection.setRemoteDescription(sdp);
            minimizeReceiverDelay(connection);
            const answer = tuneOpusForLowLatency(await connection.createAnswer());
            await connection.setLocalDescription(answer);
            socket.emit("webrtc_answer", {
                table,
                sdp: connection.localDescription
            });
            audioStatus.textContent = "Connecting...";
        }

        socket.on("state_update", renderState);

        socket.on("webrtc_offer", async (data) => {
            if (data.table !== currentState.active_table) {
                return;
            }

            try {
                await handleOffer(data.table, data.sdp);
            } catch (error) {
                closeInstructorAudio();
                audioStatus.textContent = "Unable to connect.";
            }
        });

        socket.on("student_ice_candidate", async (data) => {
            if (!peerConnection || data.table !== connectedTable || !data.candidate) {
                return;
            }

            if (shouldUseIceCandidate(data.candidate)) {
                try {
                    await peerConnection.addIceCandidate(data.candidate);
                } catch (error) {
                    audioStatus.textContent = "Network setup failed.";
                }
            }
        });

        socket.on("stop_instructor_audio", () => {
            closeInstructorAudio();
            if (!currentState.active_student) {
                audioStatus.textContent = "No microphone selected.";
            }
        });

        socket.on("audio_error", (data) => {
            if (data.table === currentState.active_table) {
                audioStatus.textContent = "Microphone error: " + data.message;
            }
        });

        renderState(initialState);
    </script>
</body>
</html>
