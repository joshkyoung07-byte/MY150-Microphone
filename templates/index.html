<!DOCTYPE html>
<html>
<head>
    <title>MY 150 Questions</title>
</head>
<body style="background-color: #1E3765; color: white; font-family: sans-serif;">
    <form action="/login" method="POST" style="max-width: 420px; margin: 80px auto; text-align: center;">
        <h1>Class Code</h1>
        <input type="text" placeholder="Class Code" name="class_code" style="width: 100%; padding: 10px;">
        <p style="color: #ffb3b3;">{{ code_error }}</p>

        <h1>Table Number</h1>
        <input type="text" placeholder="Table Number" name="table_number" style="width: 100%; padding: 10px;">

        <p style="margin-top: 20px;">Use the instructor code without a table number.</p>

        <button type="submit" style="margin-top: 20px; padding: 10px 18px;">Enter</button>
    </form>
</body>
</html>
